name: Test

on: [push, pull_request]

permissions: read-all

jobs:
  test_rust:
    name: Test - Rust engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests (unit + golden fixtures)
        run: cargo test --manifest-path rust/Cargo.toml

  test_linux:
    name: Test - Ubuntu Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "${{ matrix.node-version }}"
          registry-url: "https://registry.npmjs.org"
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install dependencies and link
        run: npm ci && npm link
      - name: Run tests (builds the WebAssembly engine first)
        run: npm run test

  test_windows:
    name: Test - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install dependencies and link
        run: npm ci && npm link
      - name: Run tests (builds the WebAssembly engine first)
        run: npm run test

  test_mac:
    name: Test - MacOs
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install dependencies and link
        run: npm ci && npm link
      - name: Run tests (builds the WebAssembly engine first)
        run: npm run test
