---
#######################################
# Start the job on all push to master #
#######################################
name: "Deploy release"
on:
  release:
    # Want to run the automation when a release is created
    types: ["created"]

permissions: read-all

###############
# Set the Job #
###############
jobs:
  build:
    # Name the Job
    name: Deploy release on NPM
    # Set the agent to run on
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      id-token: write # Required for OIDC
      contents: read
    # Only run this on the main repo
    if: "!contains(github.event.head_commit.message, 'skip deploy')"
    ##################
    # Load all steps #
    ##################
    steps:
      ##########################
      # Checkout the code base #
      ##########################
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      ##############################################################
      # Publish updated version of markdown-table-formatter on NPM #
      ##############################################################
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted publishing (OIDC) requires npm 11.5.1+
      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      # The WebAssembly engine is built from rust/ (npm prepack and pretest hooks)
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - run: npm install
      - run: npm run test:coverage
      - run: git status && git stash
      # Authenticated with OIDC (npm trusted publisher), provenance is generated automatically
      - run: npm publish
